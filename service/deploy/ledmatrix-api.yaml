# ledmatrix-api on a k3s cluster behind an Envoy Gateway that already serves a wildcard certificate.
# The hostname is not stored in the repository. Deploy with your own name:
#   API_HOST=apis.your-domain.example IMAGE=ghcr.io/suvl/ledmatrix-api:latest PULL_POLICY=Always \
#     envsubst '${API_HOST} ${IMAGE} ${PULL_POLICY}' < service/deploy/ledmatrix-api.yaml | kubectl apply -f -
# For an image loaded onto the node by hand use IMAGE=ledmatrix-api:local PULL_POLICY=Never.
# Master secret (create it BEFORE deploying; the display signs every request with a key derived from it, see
# shared/device-auth.md). Make one and keep an OFFLINE BACKUP: after the display's chip key is burned a lost master
# secret cannot be recovered, and the display would be locked out of this service for good.
#   Make the secret as described in docs/install.md ("Make the master secret and back it up"; the file stays outside the
#   repository), then:
#   kubectl create secret generic ledmatrix-api --from-file=master-secret=$HOME/ledmatrix-secrets/master-secret
# The pod does not start without that secret (the service also refuses to start without a master secret), so the API is
# never left open by accident. The secret below reaches the service as an environment variable. To keep it out of the
# environment instead, mount the same secret as a file (a secret volume plus a volumeMount, e.g. at /run/secrets) and
# set MASTER_SECRET_FILE=/run/secrets/master-secret in place of the MASTER_SECRET entry: exactly one of the two.
# Optional settings, as plain env entries below: REVOKED_DEVICES (comma-separated device
# IDs the service refuses) and PUBLIC_HOST (the name the display uses, if a proxy rewrites the Host header).
# AUTH_OFF=1 exists for running the service on your own computer; do not use it here.
# Firmware images are part of the image (/firmware, see service/README.md): there is nothing to mount or create for them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledmatrix-api
  namespace: default
  labels: {app: ledmatrix-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledmatrix-api}
  template:
    metadata:
      labels: {app: ledmatrix-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # distroless "nonroot"; a number, so the kubelet can verify it is not root
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      volumes:
        # Airline logos are trademarks and are not in the image. Build them with tools/make_logos.py, then:
        #   kubectl create configmap ledmatrix-logos --from-file=logos/ --dry-run=client -o yaml | kubectl apply -f -
        # (about 80 KB). The service works without it: every logo answer is then 404 and the display draws a badge.
        - name: logos
          configMap: {name: ledmatrix-logos, optional: true}
      containers:
        - name: ledmatrix-api
          image: ${IMAGE}
          imagePullPolicy: ${PULL_POLICY}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: LISTEN, value: ":8080"}
            - {name: LOGO_DIR, value: /logos}
            - name: MASTER_SECRET
              valueFrom:
                secretKeyRef: {name: ledmatrix-api, key: master-secret}
            # - {name: REVOKED_DEVICES, value: "aabbccddeeff"}
            # - {name: PUBLIC_HOST, value: "ledmatrix.example.com"}
          volumeMounts:
            - {name: logos, mountPath: /logos, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 200m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ledmatrix-api
  namespace: default
  labels: {app: ledmatrix-api}
spec:
  selector: {app: ledmatrix-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ledmatrix-api
  namespace: default
spec:
  hostnames: ["${API_HOST}"]
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: gateway, namespace: default}
  rules:
    - backendRefs:
        - {name: ledmatrix-api, port: 80}
