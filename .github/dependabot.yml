# Dependabot version updates (https://docs.github.com/en/code-security/dependabot/dependabot-version-updates).
#
# Three things are kept current: the GitHub Actions of the workflow (pinned by commit hash, so Dependabot
# moves the hash and the version comment together), the Go modules of the service, and the Docker base images
# of the service. A week is one review: every ecosystem opens at most a few pull requests, and each group below
# is one pull request however many dependencies it holds. Security updates are separate (they are switched on
# in the repository settings) and ignore these limits and this schedule.
#
# The workflow runs only on a push to main, so a Dependabot pull request has no check of its own: read what it
# changes, merge it, and look at the run that the merge starts (a failed run leaves the image of the last good
# one in place). The toolchain pinned in the workflow's env block (arduino-cli, the esp32 core, the Arduino
# libraries) is not something Dependabot can see; docs/security.md lists those pins for a manual check.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # A new release waits a week before it is proposed (security updates are not delayed), which is the time
    # in which most compromised releases are found and withdrawn.
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - github-actions
    groups:
      # Minor and patch releases: one pull request. A new major version is the one change that can break the
      # workflow, so it comes by itself, in its own pull request.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - go
    groups:
      # The service has no module besides the standard library today; this keeps the first ones in one pull request.
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - docker
    groups:
      # The build image (golang) and the image that ships (distroless): one pull request for both.
      docker-base-images:
        patterns:
          - "*"
