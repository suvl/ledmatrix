name: ledmatrix-api image

# One workflow, one image: the service image carries the firmware that matches the repository state (shared/firmware-update.md).
# The steps: test the service, test the host-side code, compile the firmware, write the manifest and the image into
# service/firmware/ (git-ignored), sign the manifest, then build the service image with that folder in it. The one secret is
# UPDATE_SIGNING_KEY, the private half of the firmware update signing key (shared/manifest-signing.md): only the step "Sign the
# manifest" sees it. Until the secret exists, REQUIRE_SIGNING below lets the release go out unsigned, loudly.
# Every action is pinned by the full hash of a release commit (a tag can be moved by its author, a hash cannot); the comment
# names the release. Dependabot (.github/dependabot.yml) proposes new ones and moves hash and comment together.

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "arduino/**"
      - "shared/**"
      - "tools/make_manifest.py"
      - "tools/update_signing.py"
      - "tools/sign_manifest.py"
      - "tools/gen_signing_key.py"
      - "tools/make_test_manifests.py"
      - "tools/test_sign_manifest.py"
      - ".github/workflows/service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Signing policy. "0": while the repository secret UPDATE_SIGNING_KEY is empty or missing, the release goes out UNSIGNED, with a
  # loud warning (a signed manifest must still verify). "1": an empty secret FAILS the run and nothing is published (fail closed).
  # Set to "1" once the secret UPDATE_SIGNING_KEY exists (gh secret set UPDATE_SIGNING_KEY < ledmatrix-update-A.github-secret.txt).
  REQUIRE_SIGNING: "0"
  # The toolchain, pinned. Change a pin here and the cache below (keyed on all of them) starts afresh.
  ARDUINO_CLI_VERSION: "1.6.0"
  # SHA-256 of arduino-cli_<version>_Linux_64bit.tar.gz, from the release's own checksums file.
  ARDUINO_CLI_SHA256: "321ee249f44c78053234fec0f36101092bc6021bf24939e15e0cc2449c5ed250"
  ESP32_CORE_VERSION: "3.3.13"
  ESP32_INDEX_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
  FQBN: "esp32:esp32:adafruit_matrixportal_esp32s3"
  # What the sketch includes (ArduinoJson, Adafruit Protomatter and, through it, Adafruit GFX and Adafruit BusIO), at the
  # versions the firmware is developed with. Installed one by one without dependency resolution so nothing floats to a newer one.
  ARDUINO_LIBRARIES: |
    Adafruit BusIO@1.17.4
    Adafruit GFX Library@1.13.0
    Adafruit Protomatter@1.7.1
    ArduinoJson@7.4.3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: Test
        working-directory: service
        run: go vet ./... && go test -count=1 ./...
      - name: Python tests
        run: |
          python3 -I tools/test_make_manifest.py
          python3 -I tools/test_sign_manifest.py
          python3 -I tools/test_provision.py
          python3 -I tools/test_burn_key.py

      - name: Arduino settings
        id: arduino
        run: |
          {
            echo "ARDUINO_DIRECTORIES_DATA=$HOME/.arduino15"
            echo "ARDUINO_DIRECTORIES_USER=$HOME/Arduino"
            echo "ARDUINO_DIRECTORIES_DOWNLOADS=$RUNNER_TEMP/arduino-downloads"
            echo "ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS=$ESP32_INDEX_URL"
            echo "ARDUINO_METRICS_ENABLED=false"
            echo "ARDUINO_UPDATER_ENABLE_NOTIFICATION=false"
          } >> "$GITHUB_ENV"
          pins="$(printf '%s\n' "$ARDUINO_CLI_VERSION" "$ESP32_CORE_VERSION" "$FQBN" "$ARDUINO_LIBRARIES")"
          echo "key=$(printf '%s' "$pins" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache the Arduino core and libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.arduino15
            ~/Arduino
          key: arduino-${{ runner.os }}-cli${{ env.ARDUINO_CLI_VERSION }}-esp32${{ env.ESP32_CORE_VERSION }}-${{ steps.arduino.outputs.key }}
      - name: Install arduino-cli
        run: |
          archive="$RUNNER_TEMP/arduino-cli.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          echo "${ARDUINO_CLI_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/arduino-cli-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/arduino-cli-bin" arduino-cli
          echo "$RUNNER_TEMP/arduino-cli-bin" >> "$GITHUB_PATH"
      - name: Install the esp32 core and the libraries
        run: |
          arduino-cli version
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"
          arduino-cli lib update-index
          while IFS= read -r lib; do
            [ -n "$lib" ] && arduino-cli lib install --no-deps "$lib"
          done <<< "$ARDUINO_LIBRARIES"
          arduino-cli core list
          arduino-cli lib list

      - name: Host tests (C++, no hardware)
        run: |
          out="$RUNNER_TEMP/host-tests"
          mkdir -p "$out"
          json="$ARDUINO_DIRECTORIES_USER/libraries/ArduinoJson/src"
          c++ -std=c++17 -Wall -Wextra -Iarduino/ledmatrix -I"$json" tools/test_deviceauth.cpp -o "$out/test_deviceauth"
          "$out/test_deviceauth" shared/device-auth-vectors.json
          c++ -std=c++17 -Wall -Wextra -Iarduino/ledmatrix tools/test_problems.cpp -o "$out/test_problems"
          "$out/test_problems"
          c++ -std=c++17 -Wall -Wextra -Iarduino/ledmatrix tools/test_cycle.cpp -o "$out/test_cycle"
          "$out/test_cycle"
          c++ -std=c++17 -Iarduino/ledmatrix tools/test_protect.cpp arduino/ledmatrix/protect.cpp -o "$out/test_protect"
          "$out/test_protect"
          c++ -std=c++17 -Wall -Wextra -Iarduino/ledmatrix -I"$json" tools/test_otalogic.cpp -o "$out/test_otalogic"
          "$out/test_otalogic"
      - name: Compile the firmware
        run: |
          # --build-path, not --output-dir: with --output-dir this arduino-cli also writes a build/ folder into the sketch folder.
          arduino-cli compile --fqbn "$FQBN" --jobs 0 --build-path "$RUNNER_TEMP/firmware-build" arduino/ledmatrix
          ls -l "$RUNNER_TEMP/firmware-build/ledmatrix.ino.bin"
      - name: Check the compiled image (version marker, header)
        run: '"$RUNNER_TEMP/host-tests/test_otalogic" "$RUNNER_TEMP/firmware-build/ledmatrix.ino.bin"'
      - name: Write the manifest and the image into service/firmware
        run: |
          notes="$(git log -1 --format=%s)"
          line="$(python3 -I tools/make_manifest.py "$RUNNER_TEMP/firmware-build/ledmatrix.ino.bin" --version-from arduino/ledmatrix/version.h --notes="$notes" --out service/firmware)"
          echo "$line"
          echo "Firmware: \`$line\`" >> "$GITHUB_STEP_SUMMARY"
          ls -l service/firmware
      - name: Sign the manifest
        env:
          # The one step that sees the signing key: no other step, action, artifact or image layer does. Empty when the secret
          # does not exist yet.
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          case "$REQUIRE_SIGNING" in
            1) allow=() ;;
            0) allow=(--allow-unsigned) ;;
            *) echo "::error::REQUIRE_SIGNING must be \"0\" or \"1\" (it is \"$REQUIRE_SIGNING\")"; exit 1 ;;
          esac
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ "$REQUIRE_SIGNING" = "0" ]; then
              msg="the manifest is NOT signed: UPDATE_SIGNING_KEY is not set; displays that enforce signatures will refuse this release"
              echo "::warning title=Unsigned release::$msg"
              echo "WARNING: $msg" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Cannot sign::UPDATE_SIGNING_KEY is not set and REQUIRE_SIGNING is 1, so nothing is published"
            fi
          fi
          python3 -I tools/sign_manifest.py service/firmware/manifest.json --keys-header arduino/ledmatrix/update_keys.h "${allow[@]}"
      - name: Check the signed manifest (public keys only)
        run: |
          allow=()
          if [ "$REQUIRE_SIGNING" = "0" ]; then allow=(--allow-unsigned); fi
          line="$(python3 -I tools/sign_manifest.py --check service/firmware/manifest.json --keys-header arduino/ledmatrix/update_keys.h "${allow[@]}")"
          echo "$line"
          echo "Signature: \`$line\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the firmware as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware
          path: |
            service/firmware/manifest.json
            service/firmware/ledmatrix-*.bin
          if-no-files-found: error
          retention-days: 30

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: service
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/suvl/ledmatrix-api:latest
            ghcr.io/suvl/ledmatrix-api:${{ github.sha }}
